<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>P6 Science Wrong Answer Coach V1</title><style>body{font-family:Arial;margin:0;background:#f4f7fb;color:#172033}header{background:#1d4ed8;color:white;padding:24px}main{max-width:1000px;margin:auto;padding:20px}.card{background:white;border:1px solid #ddd;border-radius:14px;padding:20px;margin-bottom:16px}label{display:block;font-weight:bold;margin:12px 0 6px}input,textarea,select{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}textarea{min-height:90px}button{padding:11px 16px;border:0;border-radius:8px;background:#1d4ed8;color:white;font-weight:bold;cursor:pointer;margin-top:14px}.tabs button{background:white;color:#1d4ed8;border:1px solid #ccc;margin-right:6px}.hidden{display:none}.result{padding:14px;border-radius:10px;margin-top:15px}.ok{background:#e9f9ef;color:#146c36}.bad{background:#fff0ef;color:#b42318}.item{border:1px solid #ddd;border-radius:10px;padding:14px;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header><h1>🧪 P6 Science Wrong Answer Coach</h1><div>Singapore Primary Science • V1 • No API required</div></header><main><div class="tabs"><button onclick="show('mark')">✍️ Mark Answer</button><button onclick="show('book')">📚 Wrong Answer Book</button><button onclick="show('stats')">📊 Progress</button></div><section id="mark"><div class="card"><h2>Mark a Question</h2><label>Question</label><textarea id="q" placeholder="Enter the Science question"></textarea><div class="grid"><div><label>Question Type</label><select id="type"><option value="mcq">MCQ</option><option value="short">Short Answer</option><option value="structured">Structured</option></select></div><div><label>Theme</label><select id="theme"><option>Diversity</option><option>Cycles</option><option>Systems</option><option>Interactions</option><option>Energy</option></select></div></div><label>Correct Answer</label><textarea id="correct"></textarea><label>Student's Answer</label><textarea id="student"></textarea><label>Keywords (optional, separated by commas)</label><input id="keywords" placeholder="e.g. evaporation, water vapour"><label>Marks</label><input id="marks" type="number" value="1" min="1"><button onclick="mark()">🔎 Mark Answer</button><div id="result"></div></div><div class="card"><button onclick="demo()">Load Demo Question</button><p>No AI/API is used in V1. The browser performs exact/keyword matching and saves mistakes locally.</p></div></section><section id="book" class="hidden"><div class="card"><h2>📚 Wrong Answer Book</h2><div id="list"></div><button onclick="clearWrong()">Clear All</button></div></section><section id="stats" class="hidden"><div class="card"><h2>📊 Progress</h2><h3>Questions marked: <span id="total">0</span></h3><h3>Wrong answers: <span id="wrong">0</span></h3><h3>Accuracy: <span id="accuracy">0%</span></h3><div id="themes"></div></div></section></main><script>let wrong=JSON.parse(localStorage.getItem('p6wrong')||'[]');let history=JSON.parse(localStorage.getItem('p6history')||'[]');const $=id=>document.getElementById(id);function norm(s){return(s||'').toLowerCase().replace(/[.,!?;:()[\]"']/g,' ').replace(/\s+/g,' ').trim()}function show(id){['mark','book','stats'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden');render();}function mark(){let q=$('q').value.trim(),c=$('correct').value.trim(),s=$('student').value.trim(),type=$('type').value,theme=$('theme').value,ks=$('keywords').value.split(',').map(x=>norm(x)).filter(Boolean),marks=+$('marks').value||1;if(!q||!c||!s){alert('Please enter question, correct answer and student answer.');return}let ok,reason;if(type==='mcq'){ok=norm(c)===norm(s);reason=ok?'Exact match.':'The answer does not match the correct answer.'}else{let words=ks.length?ks:c.split(/\s+/).filter(x=>x.length>4);let found=words.filter(x=>norm(s).includes(norm(x))).length;ok=found>0;reason=found+'/'+words.length+' key concept(s) detected.'}history.push(ok);localStorage.setItem('p6history',JSON.stringify(history));let item={id:Date.now(),q,c,s,type,theme,marks,reason,date:new Date().toLocaleString()};if(!ok){wrong.unshift(item);localStorage.setItem('p6wrong',JSON.stringify(wrong))}$('result').className='result '+(ok?'ok':'bad');$('result').innerHTML='<b>'+(ok?'✅ Correct':'❌ Needs Review')+'</b><br>'+reason+(ok?'':'<br><br><b>Focus:</b> Review the scientific concept and required keywords.');render()}function render(){$('list').innerHTML=wrong.length?wrong.map(x=>`<div class="item"><b>${esc(x.q)}</b><br><small>${x.theme} • ${x.type} • ${x.date}</small><p><b>Student:</b> ${esc(x.s)}</p><p><b>Correct:</b> ${esc(x.c)}</p><p><b>Feedback:</b> ${esc(x.reason)}</p><button onclick="remove(${x.id})">Remove</button></div>`).join(''):'<p>No wrong answers yet 🎉</p>';$('total').textContent=history.length;$('wrong').textContent=wrong.length;$('accuracy').textContent=history.length?Math.round(history.filter(Boolean).length/history.length*100)+'%':'0%';$('themes').innerHTML=['Diversity','Cycles','Systems','Interactions','Energy'].map(t=>'<p><b>'+t+'</b>: '+wrong.filter(x=>x.theme===t).length+' wrong</p>').join('')}function remove(id){wrong=wrong.filter(x=>x.id!==id);localStorage.setItem('p6wrong',JSON.stringify(wrong));render()}function clearWrong(){if(confirm('Clear all wrong answers?')){wrong=[];localStorage.removeItem('p6wrong');render()}}function demo(){$('q').value='Why does water level in an open container decrease after several hours?';$('type').value='short';$('theme').value='Cycles';$('correct').value='Water evaporates into the air as water vapour.';$('student').value='The water evaporates.';$('keywords').value='evaporates, evaporation';$('marks').value=1}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}render();</script></body></html>
