<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>P6 Science Wrong Answer Coach V1</title><link rel="stylesheet" href="css/style.css"></head><body><header><div class="wrap"><h1>🧪 P6 Science Wrong Answer Coach</h1><p>Singapore Primary Science · V1 · No API required</p></div></header><main class="wrap"><div class="tabs"><button onclick="show('mark')">✍️ Mark Answer</button><button onclick="show('book')">📚 Wrong Answer Book</button><button onclick="show('stats')">📊 Progress</button></div><section id="mark"><div class="card"><h2>Mark a Question</h2><label>Question<textarea id="q" placeholder="Enter the Science question"></textarea></label><div class="grid"><label>Question Type<select id="type"><option value="mcq">MCQ</option><option value="short">Short Answer</option><option value="structured">Structured</option></select></label><label>Theme<select id="theme"><option>Diversity</option><option>Cycles</option><option>Systems</option><option>Interactions</option><option>Energy</option></select></label></div><label>Correct Answer<textarea id="correct"></textarea></label><label>Student's Answer<textarea id="student"></textarea></label><label>Keywords<input id="keywords" placeholder="evaporation, water vapour"></label><label>Marks<input id="marks" type="number" value="1" min="1"></label><button class="button" onclick="mark()">🔎 Mark Answer</button><div id="result"></div></div><div class="card"><button class="button secondary" onclick="demo()">Load Demo Question</button><p>No AI/API is used in V1. Mistakes are stored locally in this browser.</p></div></section><section id="book" class="hidden"><div class="card"><h2>📚 Wrong Answer Book</h2><div id="list"></div><button class="button secondary" onclick="clearWrong()">Clear All</button></div></section><section id="stats" class="hidden"><div class="card"><h2>📊 Progress</h2><div class="stats"><div>Marked <b id="total">0</b></div><div>Wrong <b id="wrong">0</b></div><div>Accuracy <b id="accuracy">0%</b></div></div><div id="themes"></div></div></section></main><footer>P6 Science Wrong Answer Coach V1</footer><script src="js/app.js"></script></body></html>
