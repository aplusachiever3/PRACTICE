<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f7fb">
<title>随笔记智能机器 V1.0</title>
<style>
:root{--bg:#f5f7fb;--panel:#fff;--ink:#182230;--muted:#697586;--line:#e5eaf1;--accent:#5267e8;--accent2:#e9edff;--danger:#c43c4e;--shadow:0 10px 35px #23345b0b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;color:var(--ink);border-radius:11px;padding:9px 13px}button:hover{border-color:#b8c3f8}button.primary{background:var(--accent);color:white;border-color:var(--accent)}button.danger{color:var(--danger)}.app{max-width:1250px;margin:auto;padding:24px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}.brand{display:flex;gap:12px;align-items:center}.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#687cf7,#8c63df);display:grid;place-items:center;color:white;font-size:22px;box-shadow:0 8px 20px #5267e833}.brand h1{font-size:22px;margin:0}.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.layout{display:grid;grid-template-columns:245px minmax(0,1fr);gap:20px}.side,.panel,.note-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.side{padding:17px;height:max-content;position:sticky;top:16px}.side h3{font-size:12px;letter-spacing:.08em;color:var(--muted);margin:8px 0 10px}.nav{display:flex;flex-direction:column;gap:5px}.nav button{text-align:left;border-color:transparent;background:transparent}.nav button.active{background:var(--accent2);color:#3348c8;font-weight:650}.side .small{font-size:12px;color:var(--muted);margin-top:20px;padding-top:14px;border-top:1px solid var(--line)}.main{min-width:0}.welcome{padding:24px;background:linear-gradient(120deg,#fff,#f0f3ff);border:1px solid var(--line);border-radius:18px;margin-bottom:16px}.welcome h2{margin:0 0 5px;font-size:23px}.welcome p{margin:0;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.stat{background:#ffffffc9;border:1px solid #e7eaff;border-radius:13px;padding:12px}.stat strong{display:block;font-size:22px}.stat span{font-size:12px;color:var(--muted)}.workspace{display:grid;grid-template-columns:minmax(280px,.9fr) minmax(0,1.1fr);gap:16px;align-items:start}.panel{padding:18px}.panel h2{font-size:17px;margin:0 0 14px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.field label{font-size:13px;font-weight:650}.field input,.field textarea,.search input,.field select{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:#fff;color:var(--ink);outline:none}.field input:focus,.field textarea:focus,.search input:focus{border-color:#8998fa;box-shadow:0 0 0 3px #5267e817}.field textarea{min-height:170px;resize:vertical}.row{display:flex;gap:8px}.row>*{min-width:0;flex:1}.form-actions{display:flex;gap:8px;flex-wrap:wrap}.hint{color:var(--muted);font-size:12px}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.search{flex:1;min-width:180px}.search input{padding:10px 12px}.notes{display:flex;flex-direction:column;gap:10px}.note-card{padding:14px;box-shadow:none;cursor:pointer;transition:.15s}.note-card:hover{border-color:#b7c1fa;transform:translateY(-1px)}.note-card.selected{border-color:var(--accent);box-shadow:0 0 0 2px #5267e81a}.note-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.note-title{font-weight:700;overflow-wrap:anywhere}.note-date{font-size:11px;color:var(--muted);white-space:nowrap}.note-preview{color:#5f6b7b;font-size:13px;margin:7px 0 10px;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.tags{display:flex;gap:5px;flex-wrap:wrap}.tag{font-size:11px;padding:3px 8px;border-radius:999px;background:#f0f2f7;color:#596579}.tag.star{background:#fff3d9;color:#946200}.empty{text-align:center;color:var(--muted);padding:30px 12px;border:1px dashed var(--line);border-radius:13px}.hidden{display:none!important}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#202938;color:white;padding:10px 16px;border-radius:12px;box-shadow:var(--shadow);z-index:9;max-width:90vw}.foot{text-align:center;color:var(--muted);font-size:12px;margin:20px 0 4px}.privacy{display:flex;align-items:center;gap:6px;font-size:12px;color:#27765b}.privacy i{width:7px;height:7px;border-radius:50%;background:#2eaf7d;display:inline-block}
@media(max-width:850px){.app{padding:14px}.layout{grid-template-columns:1fr}.side{position:static}.nav{display:grid;grid-template-columns:repeat(3,1fr)}.nav button{text-align:center;padding:8px 5px}.side h3{display:none}.side .small{margin-top:10px}.workspace{grid-template-columns:1fr}.welcome{padding:18px}.welcome h2{font-size:20px}.top{align-items:flex-start}.brand h1{font-size:19px}}@media(max-width:480px){.top{flex-direction:column}.top-actions{width:100%}.top-actions button{flex:1}.stats{gap:7px}.stat{padding:9px}.stat strong{font-size:19px}.nav{grid-template-columns:repeat(2,1fr)}.panel{padding:14px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
 <div class="brand"><div class="logo">✎</div><div><h1>随笔记智能机器 <span style="font-size:12px;color:#6c78d9">V1.0</span></h1><p>捕捉灵感 · 整理思路 · 找回重要想法</p></div></div>
 <div class="top-actions"><button id="exportBtn">导出备份</button><button id="importBtn">导入备份</button><button class="primary" id="newBtn">＋ 新建笔记</button><input type="file" id="importFile" accept="application/json,.json" class="hidden"></div>
</header>
<div class="layout">
<aside class="side">
 <h3>笔记空间</h3>
 <nav class="nav" id="nav">
  <button class="active" data-filter="all">▤ 全部笔记</button>
  <button data-filter="starred">★ 重要笔记</button>
  <button data-filter="recent">◷ 最近编辑</button>
  <button data-filter="ideas">✦ 灵感想法</button>
  <button data-filter="todo">☑ 待办事项</button>
  <button data-filter="archive">▣ 已归档</button>
 </nav>
 <h3 style="margin-top:22px">智能整理</h3>
 <button id="organizeBtn" style="width:100%;text-align:left">✧ 分析当前笔记</button>
 <button id="clearSearchBtn" style="width:100%;text-align:left;margin-top:6px">⌕ 清除搜索</button>
 <div class="small"><div class="privacy"><i></i> 本地保存模式</div><p>笔记保存在此浏览器的本机存储中，不会自动上传到服务器。请定期导出备份。</p><p id="storageInfo"></p></div>
</aside>
<main class="main">
 <section class="welcome">
  <h2>把脑中的想法，变成找得到的知识。</h2>
  <p>随时记录一闪而过的灵感，再用搜索、标签和智能提示整理它们。</p>
  <div class="stats"><div class="stat"><strong id="totalStat">0</strong><span>全部笔记</span></div><div class="stat"><strong id="starStat">0</strong><span>重要笔记</span></div><div class="stat"><strong id="todoStat">0</strong><span>待办笔记</span></div></div>
 </section>
 <div class="workspace">
  <section class="panel" id="editor">
   <h2 id="editorHeading">✎ 快速记录</h2>
   <form id="noteForm">
    <div class="field"><label for="noteTitle">标题</label><input id="noteTitle" maxlength="160" placeholder="给这个想法起个名字…" required></div>
    <div class="field"><label for="noteBody">内容</label><textarea id="noteBody" placeholder="先记下来，不必一开始就整理得很完美…" ></textarea></div>
    <div class="row"><div class="field"><label for="noteCategory">分类</label><select id="noteCategory"><option value="随笔">随笔</option><option value="灵感">灵感</option><option value="待办">待办</option><option value="工作">工作</option><option value="学习">学习</option><option value="生活">生活</option><option value="项目">项目</option></select></div><div class="field"><label for="noteTags">标签</label><input id="noteTags" placeholder="想法, 计划, 重要"></div></div>
    <div class="form-actions"><button class="primary" type="submit" id="saveBtn">保存笔记</button><button type="button" id="resetBtn">清空编辑器</button><button type="button" id="starBtn">☆ 标记重要</button></div>
    <p class="hint" id="editHint">提示：内容会保存在当前浏览器。标题和正文都可以用关键词搜索。</p>
   </form>
   <div id="insight" class="hidden" style="margin-top:14px;padding:13px;background:#f3f5ff;border-radius:12px"><strong>✧ 笔记整理建议</strong><p id="insightText" style="margin-bottom:0;font-size:13px"></p></div>
  </section>
  <section>
   <div class="toolbar"><div class="search"><input id="searchInput" placeholder="⌕ 搜索标题、内容或标签…"></div><select id="sortSelect" aria-label="排序" style="border:1px solid var(--line);border-radius:11px;padding:10px;background:white"><option value="updated">最近编辑</option><option value="created">最近创建</option><option value="title">标题 A–Z</option></select></div>
   <div id="listLabel" style="font-weight:700;margin:0 0 10px">全部笔记</div>
   <div class="notes" id="notesList"></div>
   <div id="emptyState" class="empty hidden"><div style="font-size:28px;margin-bottom:8px">✎</div><strong>这里还没有笔记</strong><p style="font-size:13px">写下第一个想法，建立你的个人知识库。</p><button class="primary" id="emptyNewBtn">创建第一条笔记</button></div>
  </section>
 </div>
 <div class="foot">随笔记智能机器 V1.0 · 独立运行 · 不需要 API · 数据由你掌控</div>
</main>
</div>
</div>
<div id="toast" class="toast hidden" role="status"></div>
<script>
(function(){
'use strict';
const KEY='suibiji_machine_v1_notes';
let notes=[],activeFilter='all',editingId=null,editorStarred=false,toastTimer=null;
const $=id=>document.getElementById(id);
const now=()=>new Date().toISOString();
const makeId=()=>Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9);
function load(){try{const raw=localStorage.getItem(KEY);notes=raw?JSON.parse(raw):[];if(!Array.isArray(notes))notes=[];}catch(e){notes=[];notify('本地数据读取失败，请检查浏览器存储权限。');}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(notes));$('storageInfo').textContent='已保存 '+notes.length+' 条笔记';return true;}catch(e){notify('保存失败：浏览器存储空间可能不足，请导出备份。');return false;}}
function notify(msg){const t=$('toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add('hidden'),2600);}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function dateLabel(s){if(!s)return'';const d=new Date(s);return isNaN(d)?'':d.toLocaleDateString('zh-CN',{month:'short',day:'numeric'})+' '+d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});}
function getFiltered(){let arr=[...notes];if(activeFilter==='starred')arr=arr.filter(n=>n.starred&&!n.archived);else if(activeFilter==='recent')arr=arr.filter(n=>!n.archived).sort((a,b)=>new Date(b.updated)-new Date(a.updated)).slice(0,20);else if(activeFilter==='ideas')arr=arr.filter(n=>n.category==='灵感'&&!n.archived);else if(activeFilter==='todo')arr=arr.filter(n=>n.category==='待办'&&!n.archived);else if(activeFilter==='archive')arr=arr.filter(n=>n.archived);else arr=arr.filter(n=>!n.archived);const q=$('searchInput').value.trim().toLowerCase();if(q)arr=arr.filter(n=>[n.title,n.body,n.category,(n.tags||[]).join(' ')].join(' ').toLowerCase().includes(q));const sort=$('sortSelect').value;if(activeFilter!=='recent'){if(sort==='title')arr.sort((a,b)=>a.title.localeCompare(b.title,'zh-CN'));else if(sort==='created')arr.sort((a,b)=>new Date(b.created)-new Date(a.created));else arr.sort((a,b)=>new Date(b.updated)-new Date(a.updated));}return arr;}
function render(){const arr=getFiltered();$('notesList').innerHTML='';$('emptyState').classList.toggle('hidden',arr.length>0);$('notesList').classList.toggle('hidden',arr.length===0);const labels={all:'全部笔记',starred:'重要笔记',recent:'最近编辑',ideas:'灵感想法',todo:'待办事项',archive:'已归档'};$('listLabel').textContent=labels[activeFilter]+' · '+arr.length;for(const n of arr){const card=document.createElement('article');card.className='note-card'+(n.id===editingId?' selected':'');card.tabIndex=0;card.setAttribute('role','button');card.setAttribute('aria-label','编辑笔记 '+n.title);const tags=(n.tags||[]).map(t=>'<span class="tag">'+esc(t)+'</span>').join('');card.innerHTML='<div class="note-head"><div class="note-title">'+(n.starred?'★ ':'')+esc(n.title)+'</div><div class="note-date">'+esc(dateLabel(n.updated))+'</div></div><div class="note-preview">'+esc(n.body||'（暂无正文）')+'</div><div class="tags"><span class="tag">'+esc(n.category||'随笔')+'</span>'+tags+(n.archived?'<span class="tag">已归档</span>':'')+'</div>';card.addEventListener('click',()=>editNote(n.id));card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();editNote(n.id);}});$('notesList').appendChild(card);} $('totalStat').textContent=notes.filter(n=>!n.archived).length;$('starStat').textContent=notes.filter(n=>n.starred&&!n.archived).length;$('todoStat').textContent=notes.filter(n=>n.category==='待办'&&!n.archived).length;$('storageInfo').textContent='已保存 '+notes.length+' 条笔记';document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.filter===activeFilter));}
function clearEditor(){editingId=null;editorStarred=false;$('noteForm').reset();$('editorHeading').textContent='✎ 快速记录';$('saveBtn').textContent='保存笔记';$('starBtn').textContent='☆ 标记重要';$('editHint').textContent='提示：内容会保存在当前浏览器。标题和正文都可以用关键词搜索。';$('insight').classList.add('hidden');render();}
function editNote(id){const n=notes.find(x=>x.id===id);if(!n)return;editingId=id;editorStarred=!!n.starred;$('noteTitle').value=n.title;$('noteBody').value=n.body;$('noteCategory').value=n.category||'随笔';$('noteTags').value=(n.tags||[]).join(', ');$('editorHeading').textContent='✎ 编辑笔记';$('saveBtn').textContent='更新笔记';$('starBtn').textContent=editorStarred?'★ 已标记重要':'☆ 标记重要';$('editHint').textContent='创建于 '+dateLabel(n.created)+'；最后编辑 '+dateLabel(n.updated);$('insight').classList.add('hidden');render();if(window.innerWidth<850)$('editor').scrollIntoView({behavior:'smooth',block:'start'});}
function saveNote(e){e.preventDefault();const title=$('noteTitle').value.trim();if(!title){notify('请先填写标题。');$('noteTitle').focus();return;}const old=notes.find(n=>n.id===editingId);const item={id:old?old.id:makeId(),title,body:$('noteBody').value.trim(),category:$('noteCategory').value,tags:[...new Set($('noteTags').value.split(/[,，、]/).map(t=>t.trim()).filter(Boolean))].slice(0,20),starred:old?editorStarred:false,archived:old?!!old.archived:false,created:old?old.created:now(),updated:now()};if(old)notes=notes.map(n=>n.id===old.id?item:n);else notes.unshift(item);persist();clearEditor();render();notify(old?'笔记已更新':'笔记已保存');}
function analyze(){const title=$('noteTitle').value.trim(),body=$('noteBody').value.trim(),category=$('noteCategory').value,tags=$('noteTags').value.split(/[,，、]/).map(x=>x.trim()).filter(Boolean);let suggestions=[];if(!title)suggestions.push('补充一个清楚、方便搜索的标题。');if(body.length>350)suggestions.push('正文较长，可以加小标题或拆成几条互相关联的笔记。');if(body.length>0&&body.length<25)suggestions.push('可以补充背景、下一步行动或一个具体例子，让未来的自己更容易理解。');if(!tags.length)suggestions.push('添加 1–3 个关键词标签，方便以后检索。');if(category==='待办'&&!/(今天|明天|下周|期限|截止|完成|提醒|日期|周一|周二|周三|周四|周五|周六|周日)/.test(body))suggestions.push('如果有期限，建议在正文写明完成日期。');if(!suggestions.length)suggestions.push('结构看起来不错。可检查这条笔记是否包含明确结论、下一步行动或可复用的信息。');$('insightText').textContent=suggestions.join(' ');$('insight').classList.remove('hidden');}
function exportData(){const payload={app:'随笔记智能机器',version:1,exportedAt:now(),notes};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='随笔记备份-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(url);notify('备份文件已生成。');}
function importData(file){const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result);const incoming=Array.isArray(obj)?obj:obj.notes;if(!Array.isArray(incoming))throw new Error('格式错误');if(!confirm('导入 '+incoming.length+' 条笔记？相同 ID 的笔记将被更新，其余笔记会保留。'))return;const map=new Map(notes.map(n=>[n.id,n]));for(const raw of incoming){if(!raw||typeof raw.title!=='string')continue;const id=String(raw.id||makeId());map.set(id,{id,title:raw.title.slice(0,160),body:String(raw.body||''),category:String(raw.category||'随笔'),tags:Array.isArray(raw.tags)?raw.tags.map(String):[],starred:!!raw.starred,archived:!!raw.archived,created:raw.created||now(),updated:raw.updated||now()});}notes=[...map.values()];persist();render();notify('导入完成。');}catch(e){notify('导入失败：请选用本机器导出的 JSON 备份文件。');}};reader.readAsText(file);}
$('noteForm').addEventListener('submit',saveNote);$('newBtn').addEventListener('click',()=>{clearEditor();$('noteTitle').focus();});$('emptyNewBtn').addEventListener('click',()=>{$('newBtn').click();});$('resetBtn').addEventListener('click',()=>{if(($('noteTitle').value||$('noteBody').value)&&!confirm('清空当前编辑内容？未保存的内容将丢失。'))return;clearEditor();});$('starBtn').addEventListener('click',()=>{editorStarred=!editorStarred;$('starBtn').textContent=editorStarred?'★ 已标记重要':'☆ 标记重要';if(editingId){const n=notes.find(n=>n.id===editingId);if(n){n.starred=editorStarred;n.updated=now();persist();render();}}});$('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-filter]');if(b){activeFilter=b.dataset.filter;render();}});$('searchInput').addEventListener('input',render);$('sortSelect').addEventListener('change',render);$('clearSearchBtn').addEventListener('click',()=>{$('searchInput').value='';render();});$('organizeBtn').addEventListener('click',analyze);$('exportBtn').addEventListener('click',exportData);$('importBtn').addEventListener('click',()=>$('importFile').click());$('importFile').addEventListener('change',e=>{if(e.target.files[0])importData(e.target.files[0]);e.target.value='';});
load();render();
})();
</script>
</body>
</html>
