<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f7fb">
<meta name="build-id" content="suibiji-v2-2026-10-11">
<title>随笔记智能机器 V2.0</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#202638;--muted:#737b8d;--line:#e7e9f0;--accent:#6258e8;--soft:#efedff;--green:#16866a;--shadow:0 8px 28px #25294a0a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:10px 13px}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #6258e833;outline-offset:1px}button.primary{background:var(--accent);border-color:var(--accent);color:white;font-weight:650}button.soft{background:var(--soft);border-color:transparent;color:#5148c5}button.danger{color:#b33b4c}.app{max-width:1080px;margin:auto;padding:22px}.header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:11px}.logo{width:44px;height:44px;border-radius:15px;background:linear-gradient(140deg,#6f65f5,#a28af4);color:#fff;display:grid;place-items:center;font-size:23px}.brand h1{font-size:21px;margin:0;letter-spacing:-.4px}.brand p{font-size:12px;color:var(--muted);margin:2px 0 0}.actions{display:flex;gap:7px;flex-wrap:wrap}.layout{display:grid;grid-template-columns:205px minmax(0,1fr);gap:18px}.side,.panel,.note{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.side{padding:13px;height:max-content;position:sticky;top:12px}.side-title{font-size:11px;letter-spacing:.08em;color:var(--muted);padding:7px 10px}.nav{display:grid;gap:4px}.nav button{border-color:transparent;background:transparent;text-align:left;padding:9px 10px}.nav button.active{background:var(--soft);color:#4d45bf;font-weight:700}.privacy{font-size:12px;color:var(--green);padding:13px 9px 5px}.privacy small{display:block;color:var(--muted);line-height:1.5;margin-top:4px}.main{min-width:0}.hero{padding:22px;border-radius:20px;background:linear-gradient(120deg,#fff 20%,#f0efff);border:1px solid #e7e4ff;margin-bottom:14px}.hero h2{font-size:23px;letter-spacing:-.5px;margin:0 0 4px}.hero p{margin:0;color:var(--muted)}.stats{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.stat{background:#ffffffc9;border:1px solid #e7e4ff;border-radius:12px;padding:8px 12px;min-width:90px}.stat b{font-size:19px;display:block}.stat span{font-size:11px;color:var(--muted)}.capture{padding:16px;margin-bottom:14px}.capture h3,.section-head h3{font-size:16px;margin:0}.capture-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.capture textarea{display:block;width:100%;min-height:92px;resize:vertical;border:1px solid var(--line);border-radius:13px;padding:12px;background:#fcfcff;color:var(--ink)}.capture-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:9px;flex-wrap:wrap}.suggest{font-size:12px;color:var(--muted)}.toolbar{display:flex;gap:8px;margin-bottom:12px}.search{flex:1;min-width:0}.search input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:white}.toolbar select{max-width:125px;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff}.section-head{display:flex;justify-content:space-between;align-items:center;margin:0 2px 10px}.section-head span{font-size:12px;color:var(--muted)}.notes{display:grid;gap:9px}.note{padding:14px;box-shadow:none;cursor:pointer;transition:border-color .15s}.note:hover{border-color:#c4c0ff}.note-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.note-title{font-weight:750;overflow-wrap:anywhere}.note-date{font-size:11px;color:var(--muted);white-space:nowrap}.note-body{font-size:13px;color:#596174;white-space:pre-wrap;overflow-wrap:anywhere;margin:7px 0 10px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.pills{display:flex;gap:5px;flex-wrap:wrap}.pill{font-size:11px;padding:3px 8px;border-radius:999px;background:#f0f1f7;color:#60677a}.pill.star{background:#fff1cf;color:#926300}.pill.todo{background:#e1f6ef;color:#14795f}.note-actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:11px;padding-top:10px;border-top:1px solid #f0f1f5}.note-actions button{font-size:12px;padding:6px 9px}.empty{text-align:center;border:1px dashed var(--line);border-radius:15px;padding:28px;color:var(--muted);background:#ffffff80}.empty strong{color:var(--ink)}.editor{padding:17px;margin-bottom:14px}.editor-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:5px;margin-bottom:10px}.field label{font-size:12px;font-weight:700;color:#596174}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:white;color:var(--ink)}.field textarea{min-height:140px;resize:vertical}.editor-actions{display:flex;gap:7px;flex-wrap:wrap}.hidden{display:none!important}.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:20;background:#24283a;color:#fff;border-radius:12px;padding:10px 15px;box-shadow:var(--shadow);max-width:90vw}.foot{text-align:center;color:var(--muted);font-size:11px;padding:20px 0 6px}
@media(max-width:760px){.app{padding:12px}.header{align-items:flex-start}.brand h1{font-size:18px}.logo{width:40px;height:40px}.actions button{padding:8px 10px;font-size:12px}.layout{grid-template-columns:1fr;gap:12px}.side{position:static;padding:8px}.side-title,.privacy{display:none}.nav{display:flex;overflow-x:auto;gap:5px;padding:2px}.nav button{white-space:nowrap;text-align:center;padding:8px 11px;font-size:13px;flex-shrink:0}.hero{padding:17px}.hero h2{font-size:20px}.stats{gap:6px}.stat{flex:1;min-width:0;padding:7px 9px}.stat b{font-size:17px}.capture{padding:13px}.capture textarea{min-height:100px;font-size:16px}.toolbar select{max-width:105px}.note{padding:12px}.note-date{font-size:10px}.editor-grid{grid-template-columns:1fr}.editor{padding:13px}}@media(max-width:420px){.header{flex-direction:column}.actions{width:100%}.actions button{flex:1}.brand p{font-size:11px}.hero h2{font-size:18px}.stat span{font-size:10px}}
</style>
</head>
<body>
<div class="app">
<header class="header">
 <div class="brand"><div class="logo">✎</div><div><h1>随笔记智能机器 <span style="font-size:11px;color:#6258e8">V2.0</span></h1><p>生活 · 学习 · 工作，一处记录，随时找回</p></div></div>
 <div class="actions"><button id="exportBtn">导出备份</button><button id="importBtn">导入备份</button><input id="importFile" class="hidden" type="file" accept="application/json,.json"></div>
</header>
<div class="layout">
<aside class="side">
 <div class="side-title">我的空间</div>
 <nav class="nav" id="nav">
  <button class="active" data-filter="all">全部</button><button data-filter="today">今天</button><button data-filter="todo">待办</button><button data-filter="starred">重要</button><button data-filter="ideas">灵感</button><button data-filter="work">工作</button><button data-filter="study">学习</button><button data-filter="life">生活</button><button data-filter="archive">归档</button>
 </nav>
 <div class="privacy">● 仅保存在本机<small>数据不会上传到 GitHub。请偶尔导出备份；换设备时可手动导入。</small></div>
</aside>
<main class="main">
 <section class="hero">
  <h2>想到什么，先记下来。</h2><p>不用先想好分类。写完后，机器会按关键词给出分类建议。</p>
  <div class="stats"><div class="stat"><b id="totalStat">0</b><span>条记录</span></div><div class="stat"><b id="todoStat">0</b><span>待办未完成</span></div><div class="stat"><b id="todayStat">0</b><span>今天新增</span></div></div>
 </section>
 <section class="panel capture">
  <div class="capture-top"><h3>＋ 快速记录</h3><button id="advancedBtn" class="soft">详细编辑</button></div>
  <textarea id="quickText" placeholder="例如：明天给老师发课程安排；想到一个新项目；今天学会了什么……"></textarea>
  <div class="capture-bottom"><span class="suggest" id="categoryHint">自动建议分类：随笔</span><button class="primary" id="captureBtn">收下这条记录</button></div>
 </section>
 <section class="panel editor hidden" id="editor">
  <div class="capture-top"><h3 id="editorHeading">详细编辑</h3><button id="closeEditorBtn">收起</button></div>
  <form id="noteForm">
   <div class="field"><label for="noteTitle">标题</label><input id="noteTitle" maxlength="160" placeholder="给记录起个标题" required></div>
   <div class="field"><label for="noteBody">内容</label><textarea id="noteBody" placeholder="补充细节、想法或行动步骤"></textarea></div>
   <div class="editor-grid">
    <div class="field"><label for="noteCategory">分类</label><select id="noteCategory"><option>随笔</option><option>灵感</option><option>待办</option><option>工作</option><option>学习</option><option>生活</option><option>项目</option></select></div>
    <div class="field"><label for="noteTags">标签（用逗号分开）</label><input id="noteTags" placeholder="计划, 重要"></div>
    <div class="field"><label for="noteDue">截止日期（可选）</label><input id="noteDue" type="date"></div>
    <div class="field"><label for="noteDone">待办状态</label><select id="noteDone"><option value="false">未完成 / 不适用</option><option value="true">已完成</option></select></div>
   </div>
   <div class="editor-actions"><button class="primary" type="submit" id="saveBtn">保存修改</button><button type="button" id="starBtn">☆ 标记重要</button><button type="button" id="deleteBtn" class="danger">删除</button></div>
  </form>
 </section>
 <div class="toolbar"><div class="search"><input id="searchInput" placeholder="⌕ 搜索所有记录、标签和分类…"></div><select id="sortSelect" aria-label="排序"><option value="updated">最近编辑</option><option value="created">最近新增</option><option value="title">标题排序</option></select></div>
 <div class="section-head"><h3 id="listLabel">全部记录</h3><span id="resultCount">0 条</span></div>
 <div class="notes" id="notesList"></div>
 <div class="empty hidden" id="emptyState"><div style="font-size:26px">✎</div><strong>这里还空着</strong><p>先在上方写下一件事或一个想法。</p><button class="soft" id="emptyCaptureBtn">开始记录</button></div>
 <div class="foot">V2.0 · 不需要账号、不需要 API · 数据只在当前浏览器中</div>
</main>
</div>
</div>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script>
(function(){
'use strict';
const KEY='suibiji_machine_v1_notes';
let notes=[],activeFilter='all',editingId=null,editorStarred=false,toastTimer=null;
const $=id=>document.getElementById(id),now=()=>new Date().toISOString(),today=()=>new Date().toISOString().slice(0,10);
const makeId=()=>Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9);
function notify(msg){const t=$('toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add('hidden'),2400)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dateLabel(s){if(!s)return'';const d=new Date(s);return isNaN(d)?'':d.toLocaleDateString('zh-CN',{month:'short',day:'numeric'})+' '+d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}
function load(){try{const raw=localStorage.getItem(KEY);const data=raw?JSON.parse(raw):[];notes=Array.isArray(data)?data.map(n=>({...n,category:n.category||'随笔',tags:Array.isArray(n.tags)?n.tags:[],done:!!n.done,dueDate:n.dueDate||''})):[]}catch(e){notes=[];notify('读取本机记录失败，请检查浏览器存储权限。')}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(notes));return true}catch(e){notify('保存失败：浏览器空间不足，请先导出备份。');return false}}
function guessCategory(text){const s=text.toLowerCase();if(/明天|今天要|截止|提醒|记得|待办|完成|安排|预约|交.*(作业|报告|文件)|todo|deadline/.test(s))return'待办';if(/工作|客户|同事|会议|项目|老板|报价|邮件|课程|家长|学生|老师|业务|公司/.test(s))return'工作';if(/学习|复习|考试|科学|数学|英语|历史|地理|笔记|知识|练习|作业|阅读/.test(s))return'学习';if(/买|家里|家庭|健康|运动|吃饭|旅行|生日|购物|生活|账单|维修/.test(s))return'生活';if(/灵感|想法|创意|如果|设计|可以做|点子|设想/.test(s))return'灵感';return'随笔'}
function updateHint(){const t=$('quickText').value.trim();$('categoryHint').textContent='自动建议分类：'+guessCategory(t||'')+'（可在详细编辑中修改）'}
function getFiltered(){let a=[...notes],d=today();if(activeFilter==='today')a=a.filter(n=>(n.created||'').slice(0,10)===d&&!n.archived);else if(activeFilter==='todo')a=a.filter(n=>n.category==='待办'&&!n.done&&!n.archived);else if(activeFilter==='starred')a=a.filter(n=>n.starred&&!n.archived);else if(activeFilter==='ideas')a=a.filter(n=>n.category==='灵感'&&!n.archived);else if(['work','study','life'].includes(activeFilter)){const c={work:'工作',study:'学习',life:'生活'}[activeFilter];a=a.filter(n=>n.category===c&&!n.archived)}else if(activeFilter==='archive')a=a.filter(n=>n.archived);else a=a.filter(n=>!n.archived);const q=$('searchInput').value.trim().toLowerCase();if(q)a=a.filter(n=>[n.title,n.body,n.category,(n.tags||[]).join(' '),n.dueDate].join(' ').toLowerCase().includes(q));const sort=$('sortSelect').value;if(sort==='title')a.sort((x,y)=>(x.title||'').localeCompare(y.title||'','zh-CN'));else if(sort==='created')a.sort((x,y)=>new Date(y.created||0)-new Date(x.created||0));else a.sort((x,y)=>new Date(y.updated||0)-new Date(x.updated||0));return a}
function render(){const arr=getFiltered(),list=$('notesList');list.innerHTML='';$('emptyState').classList.toggle('hidden',arr.length!==0);list.classList.toggle('hidden',arr.length===0);const labels={all:'全部记录',today:'今天新增',todo:'待办事项',starred:'重要记录',ideas:'灵感想法',work:'工作',study:'学习',life:'生活',archive:'已归档'};$('listLabel').textContent=labels[activeFilter]||'全部记录';$('resultCount').textContent=arr.length+' 条';for(const n of arr){const card=document.createElement('article');card.className='note';const tags=(n.tags||[]).map(t=>'<span class="pill">'+esc(t)+'</span>').join('');const due=n.dueDate?'<span class="pill '+(n.dueDate<today()&&!n.done?'star':'')+'">期限 '+esc(n.dueDate)+'</span>':'';card.innerHTML='<div class="note-top"><div class="note-title">'+(n.done?'✓ ':'')+(n.starred?'★ ':'')+esc(n.title||'未命名记录')+'</div><div class="note-date">'+esc(dateLabel(n.updated||n.created))+'</div></div><div class="note-body">'+esc(n.body||'（暂无补充内容）')+'</div><div class="pills"><span class="pill">'+esc(n.category||'随笔')+'</span>'+tags+due+(n.done?'<span class="pill todo">已完成</span>':'')+(n.archived?'<span class="pill">已归档</span>':'')+'</div><div class="note-actions">'+(n.category==='待办'?'<button data-action="done">'+(n.done?'重新打开':'✓ 标记完成')+'</button>':'')+'<button data-action="star">'+(n.starred?'★ 取消重要':'☆ 重要')+'</button><button data-action="edit">编辑</button><button data-action="archive">'+(n.archived?'取消归档':'归档')+'</button></div>';card.querySelector('.note-title').setAttribute('role','heading');card.querySelectorAll('button').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();const act=b.dataset.action;if(act==='edit')editNote(n.id);if(act==='star'){n.starred=!n.starred;n.updated=now();persist();render()}if(act==='archive'){n.archived=!n.archived;n.updated=now();persist();render();notify(n.archived?'已归档':'已取消归档')}if(act==='done'){n.done=!n.done;n.updated=now();persist();render();notify(n.done?'已完成':'已重新打开')}}));card.addEventListener('click',()=>editNote(n.id));list.appendChild(card)}$('totalStat').textContent=notes.filter(n=>!n.archived).length;$('todoStat').textContent=notes.filter(n=>n.category==='待办'&&!n.done&&!n.archived).length;$('todayStat').textContent=notes.filter(n=>(n.created||'').slice(0,10)===today()&&!n.archived).length;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.filter===activeFilter))}
function resetEditor(){editingId=null;editorStarred=false;$('noteForm').reset();$('editorHeading').textContent='详细编辑';$('saveBtn').textContent='保存修改';$('starBtn').textContent='☆ 标记重要'}
function openEditor(){ $('editor').classList.remove('hidden');if(window.innerWidth<760)$('editor').scrollIntoView({behavior:'smooth',block:'start'})}
function editNote(id){const n=notes.find(x=>x.id===id);if(!n)return;editingId=id;editorStarred=!!n.starred;$('noteTitle').value=n.title||'';$('noteBody').value=n.body||'';$('noteCategory').value=n.category||'随笔';$('noteTags').value=(n.tags||[]).join(', ');$('noteDue').value=n.dueDate||'';$('noteDone').value=String(!!n.done);$('editorHeading').textContent='编辑记录';$('saveBtn').textContent='保存修改';$('starBtn').textContent=editorStarred?'★ 已标记重要':'☆ 标记重要';openEditor()}
function makeNote(text){const clean=text.trim();if(!clean){$('quickText').focus();notify('先写下一句话吧。');return}const category=guessCategory(clean);const title=clean.split(/\n/)[0].slice(0,80)||'快速记录';const body=clean.split(/\n/).slice(1).join('\n').trim();notes.unshift({id:makeId(),title,body,category,tags:[],starred:false,archived:false,done:false,dueDate:'',created:now(),updated:now()});if(persist()){ $('quickText').value='';updateHint();activeFilter='all';render();notify('已收下这条记录');}}
function saveEditor(e){e.preventDefault();const title=$('noteTitle').value.trim();if(!title){notify('请填写标题。');$('noteTitle').focus();return}const old=notes.find(n=>n.id===editingId);const item={id:old?old.id:makeId(),title,body:$('noteBody').value.trim(),category:$('noteCategory').value,tags:[...new Set($('noteTags').value.split(/[,，、]/).map(t=>t.trim()).filter(Boolean))].slice(0,20),starred:editorStarred,archived:old?!!old.archived:false,done:$('noteDone').value==='true',dueDate:$('noteDue').value,created:old?old.created:now(),updated:now()};if(old)notes=notes.map(n=>n.id===old.id?item:n);else notes.unshift(item);if(persist()){resetEditor();$('editor').classList.add('hidden');render();notify('已保存。')}}
function deleteNote(){if(!editingId)return;const n=notes.find(x=>x.id===editingId);if(!n||!confirm('确定删除这条记录？删除后无法从本机恢复，建议先导出备份。'))return;notes=notes.filter(x=>x.id!==editingId);persist();resetEditor();$('editor').classList.add('hidden');render();notify('记录已删除')}
function exportData(){const payload={app:'随笔记智能机器',version:2,exportedAt:now(),notes};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='随笔记本机备份-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('备份已导出，请保存好文件。')}
function importData(file){const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result),incoming=Array.isArray(obj)?obj:obj.notes;if(!Array.isArray(incoming))throw new Error('format');if(!confirm('准备导入 '+incoming.length+' 条记录。相同 ID 会更新，其他记录会保留。继续吗？'))return;const map=new Map(notes.map(n=>[n.id,n]));for(const raw of incoming){if(!raw||typeof raw.title!=='string')continue;const id=String(raw.id||makeId());map.set(id,{id,title:raw.title.slice(0,160),body:String(raw.body||''),category:String(raw.category||'随笔'),tags:Array.isArray(raw.tags)?raw.tags.map(String):[],starred:!!raw.starred,archived:!!raw.archived,done:!!raw.done,dueDate:String(raw.dueDate||''),created:raw.created||now(),updated:raw.updated||now()})}notes=[...map.values()];if(persist()){render();notify('导入完成。')}}catch(e){notify('导入失败：请选择有效的 JSON 备份文件。')}};reader.readAsText(file)}
$('captureBtn').addEventListener('click',()=>makeNote($('quickText').value));$('quickText').addEventListener('input',updateHint);$('quickText').addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();makeNote($('quickText').value)}});$('advancedBtn').addEventListener('click',()=>{resetEditor();$('noteTitle').value=$('quickText').value.trim().split(/\n/)[0].slice(0,80);$('noteBody').value=$('quickText').value.trim().split(/\n/).slice(1).join('\n');$('noteCategory').value=guessCategory($('quickText').value);$('noteDone').value='false';openEditor()});$('closeEditorBtn').addEventListener('click',()=>{$('editor').classList.add('hidden')});$('noteForm').addEventListener('submit',saveEditor);$('starBtn').addEventListener('click',()=>{editorStarred=!editorStarred;$('starBtn').textContent=editorStarred?'★ 已标记重要':'☆ 标记重要';if(editingId){const n=notes.find(n=>n.id===editingId);if(n){n.starred=editorStarred;n.updated=now();persist()}}});$('deleteBtn').addEventListener('click',deleteNote);$('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-filter]');if(b){activeFilter=b.dataset.filter;render()}});$('searchInput').addEventListener('input',render);$('sortSelect').addEventListener('change',render);$('emptyCaptureBtn').addEventListener('click',()=>$('quickText').focus());$('exportBtn').addEventListener('click',exportData);$('importBtn').addEventListener('click',()=>$('importFile').click());$('importFile').addEventListener('change',e=>{if(e.target.files[0])importData(e.target.files[0]);e.target.value=''});
load();render();updateHint();
})();
</script>
