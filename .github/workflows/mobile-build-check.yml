name: Mobile app build check

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'mobile/**'
      - '.github/workflows/mobile-build-check.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'mobile/**'
      - '.github/workflows/mobile-build-check.yml'
  workflow_dispatch:

jobs:
  build-mobile-web-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install
      - name: Build Capacitor web assets
        working-directory: mobile
        run: npm run build
      - name: Verify build output and preserved local storage key
        run: |
          test -s mobile/www/index.html
          test -s mobile/www/native-share-bridge.js
          grep -q 'suibiji_machine_v1_notes' index.html
          grep -q 'NativeShareBridge' index.html
