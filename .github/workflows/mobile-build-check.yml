name: Mobile app build check

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'mobile/**'
      - '.github/workflows/mobile-build-check.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'mobile/**'
      - '.github/workflows/mobile-build-check.yml'
  workflow_dispatch:

jobs:
  build-mobile-web-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install
      - name: Build Capacitor web assets
        working-directory: mobile
        run: npm run build
      - name: Verify build output and preserved local storage key
        run: |
          test -s mobile/www/index.html
          test -n "$(find mobile/www/assets -maxdepth 1 -type f -name '*.js' -print -quit)"
          grep -q 'suibiji_machine_v1_notes' index.html
          grep -q 'NativeShareBridge' index.html

  build-android-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install
      - name: Build mobile web assets
        working-directory: mobile
        run: npm run build
      - name: Generate Android project
        working-directory: mobile
        run: npx cap add android
      - name: Sync Capacitor plugins and web assets
        working-directory: mobile
        run: npx cap sync android
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build Android debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug
      - name: Prepare direct-download APK
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk Aplus-Suibiji.apk
      - name: Upload APK artifact for build records
        uses: actions/upload-artifact@v4
        with:
          name: suibiji-android-debug-apk
          path: Aplus-Suibiji.apk
          if-no-files-found: error
      - name: Publish latest APK download
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-latest
          name: Aplus 随笔记 Android App（最新版）
          body: 自动构建的 Android APK。点击资产 Aplus-Suibiji.apk 下载并安装。此为 Android 安装包；iPhone 不能安装 APK。
          files: Aplus-Suibiji.apk
          overwrite_files: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
