name: Daily P6 Science Maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * *"

permissions:
  contents: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate database
        run: python tests/question_validator.py
      - name: Run smoke test
        run: python tests/test_science.py
      - name: Run maintenance
        run: python maintenance/maintenance.py
      - name: Generate maintenance report
        run: python maintenance/auto_fix.py
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maintenance/maintenance_report.md
          git diff --cached --quiet || git commit -m "chore: update maintenance report"
          git push