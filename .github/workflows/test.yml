name: P6 Science Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate question database
        run: python tests/question_validator.py
      - name: Run science smoke test
        run: python tests/test_science.py
      - name: Run maintenance check
        run: python maintenance/maintenance.py