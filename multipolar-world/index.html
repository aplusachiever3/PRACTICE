<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Multipolar World Engine</title><link rel="stylesheet" href="style.css"></head><body><main><section class="hero"><div class="eyebrow">MULTIPOLAR WORLD · V16</div><h1>World Creation Machine ⚙️🌌</h1><p>Create worlds, open gates, transform identities and test cross-world entry.</p></section><section class="panel"><h2>🌍 World Creator</h2><div class="creator"><input id="name" placeholder="World name"><input id="x" placeholder="X coordinate"><input id="y" placeholder="Y coordinate"><input id="z" placeholder="Z coordinate"><input id="gravity" type="number" step=".1" value="1" placeholder="Gravity"><input id="timeRate" type="number" value="1" placeholder="Time Rate"><input id="energy" type="number" value="70" min="0" max="100" placeholder="Energy"><input id="gate" type="number" value="50" min="0" max="100" placeholder="Gate"><button onclick="createWorld()">CREATE WORLD ✨</button></div><p id="machineStatus"></p></section><section class="panel"><h2>🚪 World Gate Machine</h2><div class="gate-machine"><select id="sourceWorld"></select><span>→</span><select id="targetWorld"></select><button onclick="openGate()">OPEN GATE & TRANSFORM ⚡</button></div><div id="gateResult" class="gate-result"></div></section><section class="panel"><h2>🌐 Active Worlds</h2><div id="worlds" class="worlds"></div></section><section class="panel" id="detail"></section><section class="panel"><h2>🚪 World Network</h2><div id="network"></div></section></main><script src="rule-engine.js"></script><script src="transformation-engine.js"></script><script src="app.js"></script></body></html>
